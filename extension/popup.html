<style>
    #scanBtn {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        margin: 20px auto;
        display: block;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    #scanBtn:active {
        transform: scale(0.95);
    }
</style>

<body>
    <h3>Toxic Text Scanner</h3>
    <button id="scanBtn">Scan Page</button>
    <div id="result"></div>
    <script src="popup.js"></script>
</body>
